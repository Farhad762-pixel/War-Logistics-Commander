<!DOCTYPE html>
<html>
<head>
<title>WAR LOGISTICS COMMANDER</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:black;
    color:white;
    overflow:hidden;
}

#background{
    position:fixed;
    width:100%;
    height:100%;
    background-image:url('https://images.unsplash.com/photo-1508614589041-895b88991e3e');
    background-size:cover;
    background-position:center;
    filter:brightness(40%);
    z-index:-1;
}

.container{
    padding:20px;
}

h1{
    color:red;
    font-size:40px;
}

.stats{
    background:rgba(0,0,0,0.7);
    padding:15px;
    border-radius:10px;
    width:300px;
}

button{
    padding:12px;
    margin:5px;
    background:red;
    color:white;
    border:none;
    cursor:pointer;
    border-radius:5px;
    font-size:16px;
}

button:hover{
    background:darkred;
}

.log{
    margin-top:20px;
    background:rgba(0,0,0,0.7);
    padding:15px;
    height:220px;
    overflow:auto;
    border-radius:10px;
}

.warning{
    color:yellow;
}

.success{
    color:lightgreen;
}

.fail{
    color:red;
}

</style>
</head>

<body>

<div id="background"></div>

<div class="container">

<h1>WAR LOGISTICS COMMANDER</h1>

<h3>Modern War Logistics Simulation</h3>

<div class="stats">

<p>Food: <span id="food">100</span></p>
<p>Fuel: <span id="fuel">100</span></p>
<p>Ammunition: <span id="ammo">100</span></p>
<p>Medical: <span id="medical">100</span></p>

<p>Troop Strength: <span id="troops">100</span></p>

</div>

<br>

<button onclick="sendSupply()">Send Supply Convoy</button>

<button onclick="safeRoute()">Safe Route</button>

<button onclick="riskyRoute()">Risky Route</button>

<button onclick="nextRound()">Next Round</button>

<div class="log" id="log">

<p>War has started...</p>

</div>

</div>

<script>

let food = 100;
let fuel = 100;
let ammo = 100;
let medical = 100;
let troops = 100;

let route = "Safe";

function updateStats(){

document.getElementById("food").innerText = food;
document.getElementById("fuel").innerText = fuel;
document.getElementById("ammo").innerText = ammo;
document.getElementById("medical").innerText = medical;
document.getElementById("troops").innerText = troops;

}

function addLog(text, className=""){

let log = document.getElementById("log");

log.innerHTML += `<p class="${className}">${text}</p>`;

log.scrollTop = log.scrollHeight;

}

function safeRoute(){

route = "Safe";

addLog("You selected SAFE route.", "success");

}

function riskyRoute(){

route = "Risky";

addLog("You selected RISKY route.", "warning");

}

function sendSupply(){

food -= 10;
fuel -= 10;
ammo -= 10;
medical -= 5;

let random = Math.random();

if(route === "Risky"){

if(random < 0.5){

troops -= 20;

addLog("Enemy airstrike destroyed convoy!", "fail");

}else{

troops += 5;

addLog("Fast delivery successful!", "success");

}

}else{

if(random < 0.2){

troops -= 5;

addLog("Weather delayed supplies.", "warning");

}else{

troops += 3;

addLog("Supplies safely delivered.", "success");

}

}

checkGame();

updateStats();

}

function nextRound(){

food -= 5;
fuel -= 5;
ammo -= 5;

let randomEvent = Math.random();

if(randomEvent < 0.3){

addLog("Heavy enemy attack on frontline!", "fail");

troops -= 10;

}

else if(randomEvent < 0.6){

addLog("Troops morale increased.", "success");

troops += 5;

}

else{

addLog("Quiet battlefield round.");

}

checkGame();

updateStats();

}

function checkGame(){

if(food <= 0 || fuel <= 0 || ammo <= 0 || troops <= 0){

alert("MISSION FAILED");

location.reload();

}

if(troops >= 150){

alert("YOU WON THE WAR!");

location.reload();

}

}

updateStats();

</script>

</body>
</html>
